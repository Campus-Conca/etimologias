<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Maratón etimológico · hasta la semana 9</title>
<style>
  :root{
    --rosa:#c8127a; --ciruela:#6b1e5a; --fondo:#fbf4f9; --borde:#eadce6;
    --ok:#2e7d32; --okbg:#e8f5e9; --no:#b3541e; --nobg:#fdf0e6; --oro:#b8860b; --orobg:#fff8e1;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff;color:#2a2a2a;line-height:1.5;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 2.5rem}
  header{background:var(--ciruela);color:#fff;padding:.7rem 0;position:sticky;top:0;z-index:5}
  header .wrap{padding-bottom:0;display:flex;align-items:center;justify-content:space-between;gap:.6rem}
  header .mini{font-size:.72rem;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
  header .eq{font-weight:800;font-size:1rem;line-height:1.2}
  header .pts{background:var(--rosa);border-radius:1rem;padding:.3rem .8rem;font-weight:800;font-size:1.05rem;white-space:nowrap}
  h1{color:var(--ciruela);font-size:1.5rem;line-height:1.2;margin:1.2rem 0 .4rem}
  h2{color:var(--ciruela);font-size:1.2rem;margin:1.2rem 0 .4rem}
  p{margin:.5rem 0}
  .caja{background:var(--fondo);border:1px solid var(--borde);border-radius:.9rem;padding:.9rem 1rem;margin:1rem 0}
  .caja strong{color:var(--ciruela)}
  .caja ol,.caja ul{margin:.3rem 0;padding-left:1.2rem}
  .caja li{margin:.25rem 0}
  label{display:block;font-weight:700;color:var(--ciruela);margin:.7rem 0 .2rem;font-size:.95rem}
  input[type=text]{width:100%;border:1px solid var(--borde);border-radius:.6rem;padding:.65rem .7rem;font:inherit;font-size:16px;background:var(--fondo)}
  .btn{display:block;width:100%;border:none;border-radius:.8rem;padding:.9rem 1rem;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;margin-top:.8rem}
  .btn.rosa{background:var(--rosa);color:#fff}
  .btn.gris{background:#fff;color:var(--ciruela);border:1px solid var(--borde)}
  .btn:disabled{opacity:.45}
  .fila{display:flex;gap:.5rem}
  .fila .btn{flex:1}
  .lector{display:flex;align-items:center;gap:.5rem;background:var(--orobg);color:#6b4e00;border-radius:.7rem;padding:.5rem .8rem;margin:.9rem 0 .4rem;font-size:.95rem}
  .lector b{font-size:1.05rem}
  .barra{display:flex;align-items:center;justify-content:space-between;font-size:.85rem;color:#777;margin-top:.8rem}
  .reloj{font-weight:800;font-variant-numeric:tabular-nums;color:var(--ciruela);font-size:1.1rem}
  .reloj.urge{color:var(--no)}
  .tiempo{height:6px;background:var(--borde);border-radius:3px;overflow:hidden;margin:.35rem 0 .2rem}
  .tiempo i{display:block;height:100%;background:var(--rosa);transition:width 1s linear}
  .enun{font-size:1.15rem;font-weight:700;margin:.8rem 0 .2rem;color:#2a2a2a}
  .grande{font-family:ui-monospace,Menlo,monospace;font-size:2.1rem;font-weight:800;color:var(--rosa);text-align:center;margin:.6rem 0 .2rem;word-break:break-word;line-height:1.15}
  .sub{text-align:center;color:#777;font-size:.92rem}
  .ops{display:flex;flex-direction:column;gap:.55rem;margin-top:1rem}
  .ops button{padding:.85rem 1rem;border:2px solid var(--borde);border-radius:.8rem;background:#fff;color:var(--ciruela);font:inherit;font-weight:700;font-size:1.02rem;cursor:pointer;text-align:left;min-height:3.2rem}
  .ops button:active{background:var(--fondo)}
  .ops button.oculta{visibility:hidden}
  .ops.dos{flex-direction:row}
  .ops.dos button{flex:1;text-align:center;font-size:1.15rem;padding:1.2rem .5rem}
  .ayudas{display:flex;gap:.5rem;margin-top:1rem}
  .ayudas button{flex:1;border:1px dashed var(--ciruela);background:#fff;color:var(--ciruela);border-radius:.7rem;padding:.55rem;font:inherit;font-size:.88rem;font-weight:700;cursor:pointer}
  .ayudas button:disabled{opacity:.35;border-style:solid}
  .pista{background:var(--orobg);border-radius:.7rem;padding:.6rem .8rem;margin-top:.7rem;color:#6b4e00;font-size:.95rem}
  .veredicto{border-radius:.9rem;padding:1rem;margin:1rem 0;font-size:1rem}
  .veredicto.ok{background:var(--okbg);color:var(--ok)}
  .veredicto.no{background:var(--nobg);color:var(--no)}
  .veredicto .titulo{font-weight:800;font-size:1.25rem;margin-bottom:.3rem}
  .veredicto .resp{color:#2a2a2a;font-weight:700;margin:.3rem 0}
  .veredicto .ex{color:#444;font-size:.95rem}
  .apuestas{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:.45rem;margin-top:.7rem}
  .apuestas button{padding:.8rem 0;border:2px solid var(--borde);border-radius:.7rem;background:#fff;color:var(--ciruela);font:inherit;font-weight:800;font-size:1.15rem;cursor:pointer}
  .apuestas button.sel{background:var(--rosa);border-color:var(--rosa);color:#fff}
  .paso{display:flex;align-items:center;justify-content:center;gap:1rem;margin-top:.8rem}
  .paso button{width:3.2rem;height:3.2rem;border-radius:50%;border:2px solid var(--borde);background:#fff;color:var(--ciruela);font-size:1.6rem;font-weight:800;cursor:pointer}
  .paso output{font-size:2.4rem;font-weight:800;color:var(--rosa);min-width:3rem;text-align:center}
  .marcador{font-size:3.2rem;font-weight:900;color:var(--rosa);text-align:center;line-height:1;margin:.6rem 0}
  table{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:.5rem}
  th,td{padding:.4rem .3rem;border-bottom:1px solid var(--borde);text-align:left}
  th{color:var(--ciruela);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  .bono{color:var(--oro);font-weight:800}
  .repaso li{margin:.35rem 0}
  .flash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:5rem;pointer-events:none;opacity:0;transition:opacity .15s}
  .flash.on{opacity:1}
  .chico{font-size:.85rem;color:#888;text-align:center;margin-top:1.4rem}
  .chico button{background:none;border:none;color:#888;text-decoration:underline;font:inherit;cursor:pointer}
  .progreso{display:flex;gap:4px;margin-top:.9rem}
  .progreso span{flex:1;height:5px;border-radius:3px;background:var(--borde)}
  .progreso span.hecha{background:var(--ciruela)}
  .progreso span.actual{background:var(--rosa)}
  .lector.robo{background:#fdf0e6;color:var(--no)}
  .ops button.tachada{opacity:.35;text-decoration:line-through}
  .apuesta-fila{display:flex;align-items:center;gap:.6rem;margin-top:.7rem}
  .apuesta-fila span{flex:0 0 5.5rem;font-weight:700;color:var(--ciruela);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .apuesta-fila .apuestas{flex:1;margin:0;grid-template-columns:repeat(4,1fr)}
  .apuesta-fila .apuestas button{padding:.55rem 0}
  canvas#lienzo{display:block;width:100%;border:2px solid var(--borde);border-radius:.8rem;background:#fff;touch-action:none;margin-top:.5rem}
  .quien{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin-top:.8rem}
  .quien button{padding:.8rem .4rem;border:none;border-radius:.7rem;background:var(--ok);color:#fff;font:inherit;font-weight:800;cursor:pointer}
  .quien button.nadie{background:#fff;color:var(--no);border:1px solid var(--no)}
  .leve{font-size:.78rem;color:#888}
  .sube{color:var(--ok);font-weight:800;font-size:.85rem}
  .podio{display:flex;flex-direction:column;gap:.45rem;margin:1rem 0}
  .lugar{display:flex;align-items:center;gap:.7rem;border:1px solid var(--borde);border-radius:.8rem;padding:.6rem .9rem}
  .lugar.l0{background:var(--orobg);border-color:var(--oro);padding:.9rem}
  .lugar .med{font-size:1.6rem}
  .lugar .nom{flex:1;font-weight:800;color:var(--ciruela);font-size:1.1rem}
  .lugar.l0 .nom{font-size:1.35rem}
  .lugar .pp{font-weight:900;color:var(--rosa);font-size:1.4rem}
  details.repaso{border:1px solid var(--borde);border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0}
  details.repaso summary{font-weight:800;color:var(--ciruela);cursor:pointer}
  details.repaso li{margin:.3rem 0}
  header .pts{font-size:.9rem}
</style>
</head>
<body>
<header id="cabeza" hidden>
  <div class="wrap">
    <div><div class="mini" id="cabeza-ronda">Maratón</div><div class="eq" id="cabeza-eq"></div></div>
    <div class="pts" id="cabeza-pts">0 pts</div>
  </div>
</header>
<div class="wrap" id="app"></div>
<div class="flash" id="flash"></div>

<script>
/* ===================================================================
   Maratón etimológico · todo lo visto hasta la semana 9
   Un celular por equipo. Sin registro: nada sale del teléfono.
   El contenido de las rondas 1 a 3 es el mazo de Anki (semanas 0-6);
   el de las rondas 4 a 6 sale de las semanas 3, 7, 8 y 9.
   =================================================================== */

/* [pieza, significado, idioma, ancla, familia, nota] */
var PIEZAS = [["hidro-", "agua", "griego", "hidratante", "hidrografía, hidráulico, deshidratado", ""], ["acu- / aqua", "agua", "latín", "acuario", "acueducto, acuático, acuarela", "El español dice el agua de dos maneras, una por cada padre."], ["geo-", "tierra", "griego", "geografía", "geología, geometría, geopolítica", ""], ["terr-", "tierra", "latín", "terreno", "territorio, terrestre, extraterrestre", ""], ["bio-", "vida", "griego", "biología", "biografía, antibiótico, abiótico", ""], ["vit-", "vida", "latín", "vitamina", "vital, vitalicio, revitalizar", ""], ["graf-", "escribir, describir", "griego", "fotografía", "biografía, ortografía, telegrafía, demografía", ""], ["escrib- / scrib-", "escribir", "latín", "manuscrito", "describir, inscripción, escritura", ""], ["cardio-", "corazón", "griego", "cardiólogo", "cardiaco, taquicardia, electrocardiograma", ""], ["cord- / cor, cordis", "corazón", "latín", "cordial", "recordar, concordia, discordia, acordar", "Recordar es volver a pasar algo por el corazón."], ["-logía / -logo", "estudio, tratado", "griego", "biología", "geología, cardiología, potamología", "La pieza más rentable del idioma: se pega a casi cualquier raíz."], ["a- / an-", "sin (negación)", "griego", "amnesia", "anónimo, ateo, abiótico, apolítico, anemia", ""], ["mnem-", "memoria", "griego", "amnesia", "amnistía, mnemotecnia", "Amnistía es un olvido que se firma; amnesia, uno que te pasa."], ["amor", "amor", "latín", "amigo", "amoroso, enamorar, amable", "Amigo viene de amar. Está en la palabra."], ["éros", "amor", "griego", "erótico", "Erasmo", "Erasmo significaba «amable, deseado»."], ["oculus", "ojo", "latín", "oculista", "ocular, binoculares, monóculo", "Ojo con la trampa: ocultar NO es de esta familia, viene de occulere (esconder)."], ["oriri", "nacer, surgir", "latín", "Oriente", "origen, original, oriundo, aborigen", "El Oriente es, literalmente, por donde nace el sol."], ["tele-", "lejos", "griego", "teléfono", "televisión, telescopio, telegrafía, telemetría", ""], ["crono-", "tiempo", "griego", "cronómetro", "cronología, crónica, cronista, sincronizar", ""], ["-metro / -metría", "medida", "griego", "termómetro", "geometría, cronómetro, telemetría, kilómetro", ""], ["port-", "llevar", "latín", "transporte", "exportar, importar, portátil, reportero, deporte", "Una raíz no es una palabra: es una fábrica."], ["des-", "deshacer, quitar", "latín", "desayuno", "desarmar, deshacer, descansar, desorden", "Desayunar es, literal, romper el ayuno."], ["-grama", "escrito, registro", "griego", "telegrama", "programa, crucigrama, electrocardiograma", "Primo de graf-: lo ya escrito."], ["-scopio", "mirar, instrumento para mirar", "griego", "telescopio", "microscopio, periscopio, estetoscopio", ""], ["psico-", "alma, mente", "griego", "psicología", "psicólogo, psiquiatra, psicosis", ""], ["trans-", "de un lado a otro, a través", "latín", "transporte", "transformar, transmitir, transatlántico", ""], ["cali-", "bello", "griego", "caligrafía", "calistenia", "Calistenia: fuerza y belleza en el mismo ejercicio."], ["-dromo", "pista, carrera", "griego", "hipódromo", "autódromo, aeródromo, velódromo", "Compáralo con hipopótamo: misma cabeza, otro final."], ["termo-", "calor", "griego", "termómetro", "térmico, termo, termostato", "El termo de tu café trae la raíz puesta."], ["-ónimo / ónoma", "nombre", "griego", "anónimo", "seudónimo, sinónimo, antónimo, homónimo", "Anónimo: sin nombre. El an- de tu mazo, con pieza nueva."], ["-itis", "inflamación", "griego", "otitis", "gastritis, dermatitis, apendicitis, laringitis, amigdalitis", "Una pieza, diez diagnósticos gratis."], ["-algia", "dolor", "griego", "cefalalgia", "neuralgia, lumbalgia, otalgia, nostalgia", "Hay dolores que no son del cuerpo: nostalgia es uno."], ["anti-", "contra", "griego", "antibiótico", "antídoto, antipatía, antisocial, antiséptico", ""], ["hiper-", "de más, por encima", "griego", "hipertensión", "hiperactivo, hipermercado, hipérbole", ""], ["hipo- (hypó)", "de menos, debajo", "griego", "hipotermia", "hipoglucemia, hipotensión, hipótesis", "No confundir con el otro hipo-, el de híppos (caballo), de la semana 5."], ["iatro- / -iatra", "médico", "griego", "pediatra", "psiquiatra, geriatra, iatrogenia, iatrofobia", "La promesa de la semana 0, pagada: una raíz que desbloquea cincuenta palabras."], ["biblio-", "libro", "griego", "biblioteca", "bibliografía, bibliófilo, Biblia", ""], ["demo-", "pueblo", "griego", "democracia", "demografía, pandemia, endemia, demagogo", ""], ["-cracia", "poder, gobierno", "griego", "democracia", "aristocracia, burocracia, gerontocracia, teocracia", ""], ["-fobia", "miedo, rechazo", "griego", "claustrofobia", "aracnofobia, xenofobia, fotofobia, hidrofobia", ""], ["hemo- / hemato-", "sangre", "griego", "hemorragia", "hemofilia, hemoglobina, hematoma, hematología, anemia", "Ojo: hemi- (mitad, de hemisferio) es otra pieza distinta."], ["cosmo-", "orden, mundo", "griego", "cosmos", "cosmético, cosmopolita, microcosmos, cosmonauta", "El universo y un labial comparten raíz: para los griegos, lo bello era lo ordenado."], ["-nauta / naus", "navegante, nave", "griego", "astronauta", "cosmonauta, internauta, náutico, argonauta, náusea", "Náusea es, literal, el mareo del barco."], ["-polis / polit-", "ciudad", "griego", "metrópoli", "acrópolis, necrópolis, megalópolis, política, policía", "Política y policía son, las dos, asuntos de la ciudad."], ["-podo / pod-", "pie", "griego", "trípode", "podólogo, podio, antípoda, artrópodo, pulpo", "Pulpo viene de polýpous: muchos pies. Lo que llamas tentáculos, los griegos los contaron como patas."], ["zoo-", "animal", "griego", "zoológico", "zoología, protozoo, zodiaco, zoofobia, espermatozoide", "El zodiaco es el círculo de los animalitos. Por eso casi todos los signos son bichos."], ["-nomía / nomo-", "ley, regla", "griego", "astronomía", "economía, gastronomía, autonomía, agronomía, taxonomía", "Economía es oikos (casa) + nomos: las reglas de la casa."], ["hipo- (híppos)", "caballo", "griego", "hipódromo", "hipopótamo, hipocampo, hípico, Felipe", "No confundir con el hipo- de hipotermia (de menos), de la semana 4. Se ven igual y no son parientes."], ["pat- / -patía", "sentir, sufrir", "griego", "simpatía", "apatía, antipatía, empatía, telepatía, patología, patógeno", "Una raíz, tres épocas: sentimiento, pasión y por fin enfermedad."], ["-opía", "visión", "griego", "miopía", "hemeralopía, nictalopía, hipermetropía, óptica", ""], ["-fagia / -fago", "comer", "griego", "antropofagia", "necrofagia, geofagia, esófago, sarcófago", "Sarcófago es, literal, «el que come carne». Que duerman bien."], ["-latría", "adoración", "griego", "idolatría", "egolatría, heliolatría, zoolatría, necrolatría", ""], ["-filia / -filo", "amor, afinidad", "griego", "bibliofilia", "hemofilia, xenofilia, filatelia, filántropo", ""], ["-mancia", "adivinación", "griego", "quiromancia", "cartomancia, piromancia, nigromancia", ""], ["necro-", "muerte, muerto", "griego", "necrópolis", "necrología, necrofagia, necrosis", "La necrópolis es la ciudad de los muertos: los griegos no pusieron tumbas, pusieron una ciudad."], ["cripto-", "oculto, escondido", "griego", "criptografía", "cripta, criptomoneda, criptozoología", "Criptozoología: el estudio de los animales ocultos. El chupacabras tiene su disciplina."], ["teo-", "dios", "griego", "teología", "teocracia, ateo, politeísmo, monoteísmo", "El a- de ateo es el mismo de amnesia, desde la semana 2."], ["piro-", "fuego", "griego", "piromanía", "pirotecnia, pirógrafo, pirofobia, piromancia", ""], ["xeno-", "extraño, extranjero", "griego", "xenofobia", "xenofilia, xenófobo", ""]];
var HISTORIAS = [["desayuno", "romper el ayuno", "español, del latín", "des + ayuno", "breakfast (break + fast), déjeuner", "Tres lenguas tuvieron la misma idea: la primera comida del día rompe el ayuno."], ["deporte", "llevarse lejos, a distraerse", "latín (deportare)", "de + port + e", "deportivo, deportista", "El corte que parecía falso y era real: la fuente lo salvó en el torneo."], ["nostalgia", "el dolor por el regreso que no llega", "griego (nóstos + algos)", "nóstos (regreso) + -algia (dolor)", "algia, neuralgia, cefalalgia", "La inventó un estudiante suizo en 1688 para nombrar la enfermedad de extrañar la casa."], ["otorrinolaringólogo", "el especialista en oído, nariz y garganta", "griego", "oto + rino + laringo + -logo", "otitis, rinoceronte, laringitis", "Ninguna palabra es larga: solo es una suma que nadie te había enseñado a leer."], ["rinoceronte", "el del cuerno en la nariz", "griego (rhis + kéras)", "rino (nariz) + ceronte (cuerno)", "rinitis, rinoplastia", "Literal, y nadie lo había notado."], ["gimnasio", "el lugar donde se entrena desnudo", "griego (gymnós, desnudo)", "gymnós + -sio", "gimnasta, gimnasia", "Los atletas griegos entrenaban sin ropa. Cada vez que este curso te manda al gimnasio, el griego se ríe un poco."], ["quimera", "algo imposible de realizar", "griego (Chímaira)", "la criatura de león, cabra y dragón", "quimérico", "Era un monstruo que echaba fuego. Hoy es cualquier cosa tan imposible como él."], ["reloj", "el que cuenta las horas", "griego, por el latín horologium", "hōra (hora) + lógos (contar)", "horario, hora, cronología", "El re- no es prefijo: es horo- gastado por los siglos. Dos raíces griegas disfrazadas de palabra corta."], ["cosmético", "lo que sirve para poner en orden", "griego (kosmetikós)", "cosmo- (orden)", "cosmos, cosmetología", "Maquillarse es, literalmente, ordenarse la cara."], ["náusea", "el mareo del barco", "griego (nausía)", "naus (nave)", "náutico, nauta, astronauta", "Antes de existir el coche, marearse era cosa de navegantes."], ["pulpo", "el de muchos pies", "griego (polýpous), por el latín", "poly (muchos) + pous (pie)", "trípode, podólogo, antípoda", "El pariente más inesperado del podio."], ["hipopótamo", "el caballo del río", "griego", "híppos (caballo) + potamós (río)", "hipódromo, Mesopotamia", "Los griegos lo vieron salir del agua y le pusieron el nombre más honesto posible."], ["hemeralopía", "problema para ver de día", "griego", "hēmera (día) + -opía (visión)", "nictalopía, hemeroteca", "Nunca la habías visto y ya la lees. Eso es el curso funcionando."], ["hemeroteca", "el depósito de los diarios", "griego", "hēmera (día) + -teca (depósito)", "hemeralopía, biblioteca", "La misma hēmera de hemeralopía, en un lugar completamente distinto."], ["dinosaurio", "lagarto terrible", "griego (deinós + saûros)", "deinós (terrible) + saûros (lagarto)", "tiranosaurio, saurio", "La inventó Richard Owen en 1842 armándola con piezas griegas, igual que tú esta semana."], ["gerontocracia", "gobierno de los viejos", "griego", "géron (anciano) + -cracia (poder)", "geriatra, gerontología", "Pregunta para discutir: ¿vivimos en una?"], ["burocracia", "el poder de las oficinas", "francés y griego", "bureau (oficina) + -cracia (poder)", "burócrata", "Palabra híbrida: mitad francesa, mitad griega. Las raíces no piden pasaporte."]];

/* Ronda 4 · ¿pieza real o espejismo? [palabra, la pieza que parece, real?, explicación] */
var ESPEJISMOS = [

var CLAVE = "maraton-etim-s9";
var S = null;          /* estado de la partida */
var reloj = null;      /* setInterval activo */

function guarda(){ try{ localStorage.setItem(CLAVE, JSON.stringify(S)); }catch(e){} }
function lee(){ try{ var t = localStorage.getItem(CLAVE); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
function borra(){ try{ localStorage.removeItem(CLAVE); }catch(e){} }

function baraja(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
var VACIAS = {de:1,del:1,la:1,el:1,los:1,las:1,que:1,por:1,para:1,una:1,uno:1,con:1,sin:1,lo:1,se:1,en:1,y:1,o:1,a:1};
function palabras(s){ return s.toLowerCase().replace(/[^a-záéíóúüñ ]/g," ").split(/\s+/).filter(function(w){ return w && !VACIAS[w]; }); }
function chocan(a, b){ var pa = palabras(a); var pb = palabras(b); return pa.some(function(w){ return pb.indexOf(w) >= 0; }); }

/* Arma una pregunta de opción múltiple: la correcta más distractores que no se le parezcan. */
function conDistractores(correcta, candidatos, cuantos){
  var ds = [];
  baraja(candidatos).forEach(function(c){ if(ds.length < cuantos && c !== correcta && !chocan(c, correcta) && ds.indexOf(c) < 0) ds.push(c); });
  var op = baraja([correcta].concat(ds));
  return {op:op, ok:op.indexOf(correcta)};
}
/* Toma n de una lista; si no alcanzan, vuelve a barajar y repite. */
function toma(lista, n){ var out = []; while(out.length < n) out = out.concat(baraja(lista)); return out.slice(0, n); }

function fichaPieza(p){
  var t = "<b>" + esc(p[0]) + "</b> = " + esc(p[1]) + " (" + esc(p[2]) + "). Ancla: " + esc(p[3]) + ".";
  if(p[4]) t += " Familia: " + esc(p[4]) + ".";
  if(p[5]) t += " " + esc(p[5]);
  return t;
}

function genPiezas(n){
  var sigs = PIEZAS.map(function(p){ return p[1]; });
  return toma(PIEZAS, n).map(function(p){
    var m = conDistractores(p[1], sigs, 3);
    return {q:"¿Qué significa esta pieza?", g:p[0], op:m.op, ok:m.ok, pista:"Ancla: " + p[3], exh:fichaPieza(p), repaso:p[0] + " = " + p[1]};
  });
}
function genGemelas(n){
  var lat = PIEZAS.filter(function(p){ return p[2] === "latín"; });
  var gri = PIEZAS.filter(function(p){ return p[2] === "griego"; });
  var sel = baraja(toma(lat, Math.ceil(n/2)).concat(toma(gri, Math.floor(n/2))));
  return sel.map(function(p){
    var gem = PIEZAS.filter(function(o){ return o[2] !== p[2] && o[1] === p[1]; })[0];
    var ex = fichaPieza(p) + (gem ? " Su gemela en " + gem[2] + ": <b>" + esc(gem[0]) + "</b>." : "");
    return {q:"¿De qué lengua viene?", g:p[0], sub:p[1], op:["griego","latín"], ok:p[2]==="griego"?0:1, dos:true, exh:ex, repaso:p[0] + " es del " + p[2]};
  });
}
function genHistorias(n){
  var sigs = HISTORIAS.map(function(p){ return p[1]; });
  return toma(HISTORIAS, n).map(function(p){
    var m = conDistractores(p[1], sigs, 3);
    var ex = "<b>" + esc(p[0]) + "</b>: " + esc(p[1]) + ". Piezas: " + esc(p[3]) + "." + (p[4] ? " Familia: " + esc(p[4]) + "." : "") + (p[5] ? " " + esc(p[5]) : "");
    return {q:"¿Qué significa, pieza por pieza?", g:p[0], sub:p[2].split(" (")[0], op:m.op, ok:m.ok, pista:"Piezas: " + p[3], exh:ex, repaso:p[0] + " = " + p[1] + " (" + p[3] + ")"};
  });
}
function genEspejismos(n){
  return toma(ESPEJISMOS, n).map(function(e){
    return {q:e[1], g:e[0], op:["Pieza real","Espejismo"], ok:e[2]?0:1, dos:true, ex:e[3], repaso:e[0] + ": " + (e[2] ? "pieza real" : "espejismo")};
  });
}
function mezcla(it){ var op = baraja(it.op); return {q:it.q, g:it.g, op:op, ok:op.indexOf(it.op[it.ok]), ex:it.ex, repaso:it.g + " → " + it.op[it.ok]}; }
function genMaquina(n){ return toma(MAQUINA, n).map(mezcla); }
function genViajeras(n){
  var nt = Math.round(n * 0.35);
  var tipos = toma(TIPOS, nt).map(mezcla);
  var vs = toma(VIAJERAS, n - nt).map(function(v){
    var otras = baraja(LENGUAS.filter(function(l){ return l !== v[1] && v[3].indexOf(l) < 0; })).slice(0, 3);
    var op = baraja([v[1]].concat(otras));
    return {q:"¿De qué lengua llegó al español?", g:v[0], op:op, ok:op.indexOf(v[1]), ex:v[2], repaso:v[0] + " ← " + v[1]};
  });
  return baraja(vs.concat(tipos));
}
function preguntaRelevo(){
  var sigs = PIEZAS.map(function(p){ return p[1]; });
  var p = PIEZAS[Math.floor(Math.random()*PIEZAS.length)];
  var m = conDistractores(p[1], sigs, 2);
  return {g:p[0], op:m.op, ok:m.ok, repaso:p[0] + " = " + p[1]};
}

/* ------------------------------------------------------------------ */
function para(){ if(reloj){ clearInterval(reloj); reloj = null; } }
function ronda(){ return RONDAS[S.r]; }
/* Con cinco, dos rondas bajan a una pregunta por persona para no pasar de 40 minutos. */
function kDe(R){ return nj() >= 5 && R.k5 ? R.k5 : R.k; }
function nj(){ return S.jugadores.length; }
function nombre(i){ return S.jugadores[i].nombre; }
/* La ronda r arranca con la persona r, para que no empiece siempre la misma. */
function dueno(qi){ return (qi + S.r) % nj(); }
function derecha(i){ return (i + 1) % nj(); }
function suma(i, pts){ S.jugadores[i].puntos += pts; }
function falla(i, txt){ var f = S.jugadores[i].fallos; if(f.indexOf(txt) < 0) f.push(txt); }
function ranking(){ return S.jugadores.map(function(j, i){ return {i:i, j:j}; }).sort(function(a, b){ return b.j.puntos - a.j.puntos; }); }

function cabeza(){
  var h = document.getElementById("cabeza");
  if(!S || S.fase === "inicio"){ h.hidden = true; return; }
  h.hidden = false;
  document.getElementById("cabeza-eq").textContent = S.fase === "final" ? "Resultado final" : ronda().titulo;
  document.getElementById("cabeza-ronda").textContent = S.fase === "final" ? "Maratón terminado" : "Ronda " + (S.r + 1) + " de " + RONDAS.length;
  var r = ranking()[0];
  document.getElementById("cabeza-pts").textContent = "👑 " + r.j.nombre + " " + r.j.puntos;
}

function progreso(){
  var h = '<div class="progreso">';
  for(var i=0;i<RONDAS.length;i++) h += '<span class="' + (i < S.r ? "hecha" : i === S.r ? "actual" : "") + '"></span>';
  return h + "</div>";
}
function tabla(conDelta){
  var h = '<table><tr><th>#</th><th>Quién</th><th class="n">Puntos</th></tr>';
  ranking().forEach(function(x, k){
    var d = conDelta && S.antes ? x.j.puntos - S.antes[x.i] : 0;
    h += '<tr><td>' + (k+1) + '</td><td>' + esc(x.j.nombre) + '</td><td class="n">' + x.j.puntos + (d ? ' <span class="sube">+' + d + '</span>' : '') + '</td></tr>';
  });
  return h + '</table>';
}

function pinta(){
  para(); cabeza(); window.scrollTo(0, 0);
  ({inicio:pintaInicio, apuesta:pintaApuesta, pregunta:pintaPregunta, veredicto:pintaVeredicto,
    dibujo:pintaDibujo, relevo:pintaRelevo, cierre:pintaCierre, final:pintaFinal})[S.fase]();
}

/* --- pregunta (turno y robo) -------------------------------------- */
function nuevaPregunta(){ S.fase = "pregunta"; S.robo = false; S.quien = dueno(S.qi); S.pistaUsada = false; S.cincuenta = false; S.tachada = -1; }
function pintaPregunta(){
  var R = ronda(), P = S.preguntas[S.qi];
  var seg0 = S.robo ? 12 : R.seg;
  var h = '<div class="barra"><span>Pregunta ' + (S.qi + 1) + ' de ' + S.preguntas.length + '</span><span class="reloj" id="seg">' + seg0 + '</span></div>';
  h += '<div class="tiempo"><i id="barra" style="width:100%"></i></div>';
  h += S.robo ? '<div class="lector robo">🦊 <span>¡Robo! <b>' + esc(nombre(S.quien)) + '</b>, por 1 punto</span></div>'
              : '<div class="lector">📣 <span>Turno de <b>' + esc(nombre(S.quien)) + '</b>: lee en voz alta y contesta solo</span></div>';
  h += '<div class="enun">' + esc(P.q) + '</div><div class="grande">' + esc(P.g) + '</div>';
  if(P.sub) h += '<div class="sub">' + esc(P.sub) + '</div>';
  h += '<div class="ops' + (P.dos ? " dos" : "") + '">';
  P.op.forEach(function(o, i){ h += '<button data-i="' + i + '"' + (i === S.tachada ? ' class="tachada" disabled' : '') + '>' + esc(o) + '</button>'; });
  h += '</div>';
  if(!P.dos && !S.robo){
    var yo = S.jugadores[S.quien];
    h += '<div class="ayudas">';
    if(P.pista) h += '<button id="pista"' + (S.pistaUsada ? " disabled" : "") + '>💡 Pista (−1 punto)</button>';
    h += '<button id="cincuenta"' + (yo.comodin < 1 || S.cincuenta ? " disabled" : "") + '>' + (S.cincuenta ? "✂️ 50/50 usado" : yo.comodin < 1 ? "✂️ Ya usaste tu 50/50" : "✂️ Tu 50/50") + '</button></div>';
    h += '<div id="pistatxt"></div>';
  }
  app.innerHTML = h;
  if(S.pistaUsada && P.pista && !S.robo) document.getElementById("pistatxt").innerHTML = '<div class="pista">' + esc(P.pista) + '</div>';
  if(S.cincuenta && !S.robo) quitaDos(P);

  [].forEach.call(app.querySelectorAll(".ops button"), function(b){ b.onclick = function(){ responde(+b.dataset.i); }; });
  var bp = document.getElementById("pista");
  if(bp) bp.onclick = function(){ S.pistaUsada = true; bp.disabled = true; document.getElementById("pistatxt").innerHTML = '<div class="pista">' + esc(P.pista) + '</div>'; guarda(); };
  var bc = document.getElementById("cincuenta");
  if(bc) bc.onclick = function(){ var yo = S.jugadores[S.quien]; if(yo.comodin < 1) return; yo.comodin--; S.cincuenta = true; bc.disabled = true; bc.textContent = "✂️ 50/50 usado"; quitaDos(P); guarda(); };

  var quedan = seg0, seg = document.getElementById("seg"), barra = document.getElementById("barra");
  reloj = setInterval(function(){
    quedan--;
    seg.textContent = quedan; barra.style.width = (100 * quedan / seg0) + "%";
    if(quedan <= 5) seg.classList.add("urge");
    if(quedan <= 0){ para(); responde(-1); }
  }, 1000);
}
function quitaDos(P){
  var malas = [];
  P.op.forEach(function(o, i){ if(i !== P.ok) malas.push(i); });
  malas.slice(0, 2).forEach(function(i){ var b = app.querySelector('.ops button[data-i="' + i + '"]'); if(b) b.classList.add("oculta"); });
}
function responde(i){
  para();
  var R = ronda(), P = S.preguntas[S.qi], bien = i === P.ok, gana = 0;
  if(S.robo){
    if(bien){ gana = 1; suma(S.quien, 1); }
    S.ultimo = {bien:bien, gana:gana, elegida:i, robo:true};
    S.fase = "veredicto"; guarda(); pinta(); return;
  }
  if(bien){ gana = Math.max(1, R.pts - (S.pistaUsada ? 1 : 0)); suma(S.quien, gana); S.aciertos[S.quien]++; }
  else falla(S.quien, P.repaso);
  /* Se puede robar si la pregunta tenía más de dos opciones y hay a quién pasarle el celular. */
  var visibles = P.op.length - (S.cincuenta ? 2 : 0) - (i >= 0 ? 1 : 0);
  S.ultimo = {bien:bien, gana:gana, elegida:i, puedeRobar:!bien && !P.dos && nj() > 1 && visibles >= 2};
  S.fase = "veredicto"; guarda(); pinta();
}

/* --- veredicto ---------------------------------------------------- */
function pintaVeredicto(){
  var P = S.preguntas[S.qi], U = S.ultimo;
  var ultima = S.qi + 1 >= S.preguntas.length;
  var siguiente = ultima ? null : nombre(dueno(S.qi + 1));
  var h = '<div class="barra"><span>Pregunta ' + (S.qi + 1) + ' de ' + S.preguntas.length + '</span><span>' + esc(nombre(S.quien)) + '</span></div>';

  if(U.puedeRobar){
    /* Falló el dueño: no se revela la respuesta todavía, para que el robo valga. */
    h += '<div class="veredicto no"><div class="titulo">' + (U.elegida < 0 ? "Se acabó el tiempo" : "Aún no") + '</div><div class="ex">' + esc(nombre(S.quien)) + ', anótala en tu repaso. La respuesta se ve después del robo.</div></div>';
    h += '<button class="btn rosa" id="robar">🦊 ' + esc(nombre(derecha(S.quien))) + ' intenta robarla</button>';
    h += '<button class="btn gris" id="paso">Nadie roba, ver la respuesta</button>';
    app.innerHTML = h;
    document.getElementById("robar").onclick = function(){ S.tachada = U.elegida; S.robo = true; S.quien = derecha(S.quien); S.fase = "pregunta"; guarda(); pinta(); };
    document.getElementById("paso").onclick = function(){ S.ultimo.puedeRobar = false; guarda(); pinta(); };
    return;
  }
  var titulo = U.bien ? (U.robo ? "¡Robada! +1 para " + nombre(S.quien) : "¡Bien! +" + U.gana) : (U.robo ? "Robo fallido" : (U.elegida < 0 ? "Se acabó el tiempo" : "Aún no"));
  h += '<div class="veredicto ' + (U.bien ? "ok" : "no") + '"><div class="titulo">' + esc(titulo) + '</div>';
  h += '<div class="resp">Respuesta: ' + esc(P.op[P.ok]) + '</div>';
  h += '<div class="ex">' + (P.exh || esc(P.ex)) + '</div></div>';
  h += '<button class="btn rosa" id="sig">' + (ultima ? "Ver cómo quedó la ronda" : "Siguiente · el celular pasa a " + esc(siguiente)) + '</button>';
  app.innerHTML = h;
  document.getElementById("sig").onclick = function(){
    if(ultima) cierraRonda();
    else { S.qi++; nuevaPregunta(); }
    guarda(); pinta();
  };
}

/* --- dibujo ------------------------------------------------------- */
function pintaDibujo(){

    h += '<div class="quien">';

      if(q <= 10) seg.classList.add("urge");

    [].forEach.call(app.querySelectorAll(".quien button"), function(b){
      b.onclick = function(){
        var g = +b.dataset.i;

      };
    });
    return;
  }
  /* sol: se revela */
  h += '<div class="grande">' + esc(W[0]) + '</div><div class="sub">' + esc(W[1]) + ' · ' + esc(W[2]) + '</div>';
  h += '<div class="veredicto ' + (S.adivino >= 0 ? "ok" : "no") + '"><div class="titulo">' + (S.adivino >= 0 ? esc(nombre(S.adivino)) + " +2 · " + esc(nombre(d)) + " +1" : "Nadie la sacó") + '</div></div>';
  var ultima = S.di + 1 >= nj();
  h += '<button class="btn rosa" id="sig">' + (ultima ? "Ver cómo quedó la ronda" : "Siguiente dibujo: " + esc(nombre((S.di + 1 + S.r) % nj()))) + '</button>';
  app.innerHTML = h;
  document.getElementById("sig").onclick = function(){
    if(ultima){ S.fase = "cierre"; S.bonos = null; }
    else { S.di++; S.paso = "tapa"; }

  };
}
function lienzo(){
  var c = document.getElementById("lienzo"), ctx = c.getContext("2d");
  var ancho = c.clientWidth, alto = Math.round(ancho * 0.9), dpr = window.devicePixelRatio || 1;
  c.width = ancho * dpr; c.height = alto * dpr; c.style.height = alto + "px";
  ctx.scale(dpr, dpr); ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#2a2a2a";
  var dib = false;
  function pos(e){ var r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  c.addEventListener("pointerdown", function(e){ dib = true; c.setPointerCapture(e.pointerId); var p = pos(e); ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(p[0]+.1, p[1]+.1); ctx.stroke(); });
  c.addEventListener("pointermove", function(e){ if(!dib) return; var p = pos(e); ctx.lineTo(p[0], p[1]); ctx.stroke(); });
  c.addEventListener("pointerup", function(){ dib = false; });
  c.addEventListener("pointercancel", function(){ dib = false; });
  document.getElementById("limpia").onclick = function(){ ctx.clearRect(0, 0, c.width, c.height); };
}

/* --- contrarreloj ------------------------------------------------- */
function pintaRelevo(){
  var R = ronda(), yo = (S.di + S.r) % nj(), Q = S.qr;
  if(S.paso === "apuesta"){
    var v = S.vApuesta == null ? 5 : S.vApuesta;
    var h = '<div class="lector">⏱️ <span>Contrarreloj de <b>' + esc(nombre(yo)) + '</b> (' + (S.di + 1) + ' de ' + nj() + ')</span></div>';
    h += '<div class="caja"><strong>Tu apuesta:</strong> ¿cuántas vas a tener bien en 30 segundos?<div class="paso"><button id="menos">−</button><output id="val">' + v + '</output><button id="mas">+</button></div></div>';
    h += '<button class="btn rosa" id="listo">¡Arranca mi reloj!</button>';
    app.innerHTML = h;
    var o = document.getElementById("val");
    document.getElementById("menos").onclick = function(){ v = Math.max(0, v-1); o.textContent = v; };
    document.getElementById("mas").onclick = function(){ v = Math.min(30, v+1); o.textContent = v; };
    document.getElementById("listo").onclick = function(){
      S.cr = {apuesta:v, bien:0, total:0}; S.paso = "corre"; S.fin = Date.now() + R.seg*1000; S.qr = preguntaRelevo(); guarda(); pinta();
    };
    return;
  }
  if(S.paso === "sol"){
    var dif = Math.abs(S.cr.apuesta - S.cr.bien), bono = dif === 0 ? 1 : 0;
    var h2 = '<div class="lector">⏱️ <span>Contrarreloj de <b>' + esc(nombre(yo)) + '</b></span></div>';
    h2 += '<div class="marcador">' + S.cr.bien + '</div><p class="sub">bien de ' + S.cr.total + ' · apostaste ' + S.cr.apuesta + (bono ? ' · <span class="bono">¡exacta! +1</span>' : '') + '</p>';
    var ultima = S.di + 1 >= nj();
    h2 += '<button class="btn rosa" id="sig">' + (ultima ? "Ver el resultado final" : "Pasa el celular a " + esc(nombre((S.di + 1 + S.r) % nj()))) + '</button>';
    app.innerHTML = h2;
    document.getElementById("sig").onclick = function(){
      if(bono){ suma(yo, 1); S.jugadores[yo].exactas++; }
      if(ultima){ S.fase = "final"; S.termino = Date.now(); }
      else { S.di++; S.paso = "apuesta"; S.vApuesta = null; }
      guarda(); pinta();
    };
    return;
  }
  var h3 = '<div class="barra"><span>' + esc(nombre(yo)) + ' · ' + S.cr.bien + ' bien</span><span class="reloj" id="seg"></span></div>';
  h3 += '<div class="tiempo"><i id="barra"></i></div>';
  h3 += '<div class="enun">¿Qué significa?</div><div class="grande">' + esc(Q.g) + '</div><div class="ops">';
  Q.op.forEach(function(o, i){ h3 += '<button data-i="' + i + '">' + esc(o) + '</button>'; });
  h3 += '</div>';
  app.innerHTML = h3;
  var seg = document.getElementById("seg"), barra = document.getElementById("barra");
  function actualiza(){
    var q = Math.max(0, Math.ceil((S.fin - Date.now())/1000));
    seg.textContent = q; barra.style.width = (100 * q / R.seg) + "%";
    if(q <= 10) seg.classList.add("urge");
    if(q <= 0){ para(); S.paso = "sol"; guarda(); pinta(); }
  }
  actualiza(); reloj = setInterval(actualiza, 250);
  [].forEach.call(app.querySelectorAll(".ops button"), function(b){
    b.onclick = function(){
      if(Date.now() >= S.fin) return;
      var bien = +b.dataset.i === Q.ok;
      S.cr.total++;
      if(bien){ S.cr.bien++; suma(yo, R.pts); } else falla(yo, Q.repaso);
      destello(bien ? "✅" : "❌");
      S.qr = preguntaRelevo(); guarda(); pinta();
    };
  });
}
function destello(t){
  var f = document.getElementById("flash"); f.textContent = t; f.classList.add("on");
  setTimeout(function(){ f.classList.remove("on"); }, 350);
}

/* --- cierre de ronda ---------------------------------------------- */
function cierraRonda(){
  S.bonos = S.jugadores.map(function(j, i){
    var ex = S.apuestas[i] === S.aciertos[i];
    if(ex){ suma(i, 1); j.exactas++; }
    return ex;
  });
  S.fase = "cierre";
}
function pintaCierre(){
  var R = ronda();
  var h = progreso() + '<h1>Así quedó la ronda ' + (S.r + 1) + '</h1>';
  if(S.bonos){
    h += '<div class="caja"><strong>La brecha.</strong> Apuesta contra resultado. Quien le atinó exacto gana +1.<table><tr><th>Quién</th><th class="n">Apostó</th><th class="n">Sacó</th><th></th></tr>';
    S.jugadores.forEach(function(j, i){
      var d = S.aciertos[i] - S.apuestas[i];
      h += '<tr><td>' + esc(j.nombre) + '</td><td class="n">' + S.apuestas[i] + '</td><td class="n">' + S.aciertos[i] + '</td><td class="n">' + (d === 0 ? '<span class="bono">+1 ★</span>' : d > 0 ? '<span class="leve">se subestimó</span>' : '<span class="leve">se confió</span>') + '</td></tr>';
    });
    h += '</table></div>';
  }
  h += '<h2>La tabla</h2>' + tabla(true);
  var ultima = S.r + 1 >= RONDAS.length;
  h += '<button class="btn rosa" id="sig">Siguiente ronda: ' + esc(RONDAS[S.r+1].titulo) + '</button>';
  app.innerHTML = h;
  document.getElementById("sig").onclick = function(){ S.r++; S.fase = "apuesta"; guarda(); pinta(); };
}

/* --- final -------------------------------------------------------- */
function pintaFinal(){
  var rk = ranking(), min = S.termino ? Math.round((S.termino - S.inicio)/60000) : null;
  var medallas = ["🥇","🥈","🥉"];
  var h = '<h1>Podio</h1><p class="sub">' + (min ? min + " minutos de maratón · " : "") + 'muéstrenle esta pantalla al profe</p><div class="podio">';
  rk.forEach(function(x, k){
    h += '<div class="lugar l' + k + '"><span class="med">' + (medallas[k] || (k+1) + "°") + '</span><span class="nom">' + esc(x.j.nombre) + '</span><span class="pp">' + x.j.puntos + '</span></div>';
  });
  h += '</div>';
  var mejor = S.jugadores.slice().sort(function(a, b){ return b.exactas - a.exactas; })[0];
  var total = RONDAS.filter(function(R){ return !R.dibujo; }).length;
  h += '<div class="caja"><strong>Premio a la calibración:</strong> ' + esc(mejor.nombre) + ', que le atinó exacto a su apuesta en ' + mejor.exactas + ' de ' + total + ' rondas. Saber cuánto sabes también es la materia.</div>';
  h += '<h2>La lista de repaso de cada quien</h2><p class="sub" style="text-align:left">Lo que se te escapó hoy. Búscalo en tu mazo de Anki y márcalo como «Otra vez». Tómale captura a la tuya.</p>';
  S.jugadores.forEach(function(j){
    h += '<details class="repaso"><summary>' + esc(j.nombre) + ' · ' + j.fallos.length + ' por repasar</summary>';
    h += j.fallos.length ? '<ul>' + j.fallos.map(function(f){ return '<li>' + esc(f) + '</li>'; }).join("") + '</ul>' : '<p>Cero fallos. Sospechoso, pero felicidades.</p>';
    h += '</details>';
  });
  h += '<button class="btn gris" id="otra">Jugar otra vez (preguntas nuevas)</button>';
  app.innerHTML = h;
  document.getElementById("otra").onclick = function(){ if(!confirm("¿Borrar este resultado y empezar de nuevo?")) return; borra(); S = {fase:"inicio"}; pinta(); };
}

/* --- arranque ----------------------------------------------------- */
S = {fase:"inicio"};
var previa = lee();
if(previa && previa.fase === "final") S = previa;
pinta();
</script>
