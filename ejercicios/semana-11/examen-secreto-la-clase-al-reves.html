<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Examen secreto 🤫 · La clase al revés · Semana 11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ciruela:#2B2440; --morado:#6B1E5A; --rosa:#C4006A; --rosa-suave:#FFD6E9; --rosa-luz:#F4A8CE;
    --jade:#0B5F52; --jade-suave:#DFF5EE; --dorado:#B07B12; --tinta:#221A3A; --gris:#4A3F5C;
    --borde:#E6DFF0; --fondo:#F4EFF9; --rojo:#A3312B; --rojo-suave:#FDECEC;
    --papel:#EFE7DD; --verde-wa:#D9FDD3; --crema:#FFF4C2;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{font-family:"Inter",system-ui,sans-serif; background:radial-gradient(120vmin 90vmin at 30% 20%, #3b2f57 0%, var(--ciruela) 55%, #1b1630 100%);
    color:var(--tinta); overflow:hidden}
  .disp{font-family:"Bricolage Grotesque","Inter",sans-serif; font-weight:800; letter-spacing:-.015em}
  button{font-family:inherit}

  /* ---------- escena ---------- */
  #escena{height:100%; display:flex; align-items:center; justify-content:center; gap:4vmin; padding:2vmin}

  /* ---------- teléfono ---------- */
  #telefono{position:relative; width:62vmin; height:96vmin; background:#0d0a16; border-radius:6vmin; padding:1.4vmin;
    box-shadow:0 3vmin 8vmin rgba(0,0,0,.55), inset 0 0 0 .3vmin #3a3150; flex:none}
  #telefono::after{content:""; position:absolute; top:1.4vmin; left:50%; transform:translateX(-50%); width:18vmin; height:3vmin;
    background:#0d0a16; border-radius:0 0 2.2vmin 2.2vmin; z-index:5}
  #vidrio{position:relative; height:100%; border-radius:4.8vmin; overflow:hidden; background:var(--papel); display:flex; flex-direction:column}

  #barra{height:5.2vmin; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 3vmin;
    font-size:2.1vmin; font-weight:700; color:#fff; background:var(--morado); position:relative; z-index:6}
  #barra.alerta{background:var(--rojo)}
  #barra.pausa #hora::after{content:" ⏸"; font-weight:400}
  #hora{font-variant-numeric:tabular-nums; min-width:9vmin}
  #hora.parpadea{animation:parpadeo 1s steps(2) infinite}
  @keyframes parpadeo{to{opacity:.25}}
  #der{display:flex; align-items:center; gap:1.2vmin}
  #marcador{font-variant-numeric:tabular-nums}
  .bateria{position:relative; width:5.2vmin; height:2.4vmin; border:.25vmin solid #fff; border-radius:.6vmin; padding:.25vmin}
  .bateria::after{content:""; position:absolute; right:-.9vmin; top:50%; transform:translateY(-50%); width:.6vmin; height:1vmin; background:#fff; border-radius:0 .2vmin .2vmin 0}
  .bateria i{display:block; height:100%; width:0%; background:#7ED957; border-radius:.3vmin; transition:width .5s, background .5s}
  .bateria i.media{background:#F5C544} .bateria i.baja{background:#FF6B6B}

  /* cabecera del chat */
  #cabeza{flex:none; display:none; align-items:center; gap:2vmin; padding:1.4vmin 2.4vmin; background:var(--morado); color:#fff; border-bottom:1px solid rgba(255,255,255,.15)}
  #cabeza.ver{display:flex}
  .flecha-atras{font-size:3vmin; opacity:.8}
  .avatar{width:6vmin; height:6vmin; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2.6vmin; font-weight:800; color:var(--tinta); flex:none; box-shadow:0 0 0 .3vmin rgba(255,255,255,.35)}
  #cab-nom{font-weight:800; font-size:2.6vmin; line-height:1.15}
  #cab-sub{font-size:1.9vmin; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:40vmin}
  #cab-sub.escribiendo{color:#B8F2C8; font-style:italic}

  #pantalla{flex:1; overflow-y:auto; overflow-x:hidden; position:relative; scroll-behavior:smooth}
  #pantalla::-webkit-scrollbar{width:0}

  /* ---------- pantalla de bloqueo ---------- */
  .lock{height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:9vmin 3vmin 4vmin; text-align:center; color:#fff;
    background:linear-gradient(170deg,#6B1E5A 0%,#2B2440 60%,#14101f 100%)}
  .lock .hora-grande{font-size:12vmin; line-height:1; font-weight:800}
  .lock .fecha{font-size:2.6vmin; opacity:.85; margin-top:1vmin}
  .notif{margin-top:7vmin; width:100%; background:rgba(255,255,255,.14); backdrop-filter:blur(8px); border-radius:2.4vmin; padding:2vmin 2.4vmin; text-align:left; display:flex; gap:2vmin; align-items:center}
  .notif .ico{width:6.5vmin; height:6.5vmin; border-radius:1.6vmin; background:#25D366; display:flex; align-items:center; justify-content:center; font-size:3.6vmin; flex:none}
  .notif b{display:block; font-size:2.4vmin}
  .notif span{font-size:2.1vmin; opacity:.9; line-height:1.35}
  .notif small{position:absolute; right:3.5vmin; margin-top:-6.5vmin; font-size:1.7vmin; opacity:.7}
  .notif + .notif{margin-top:1.4vmin}
  .desliza{margin-top:auto; font-size:2.4vmin; opacity:.9; display:flex; flex-direction:column; align-items:center; gap:.6vmin}
  .desliza i{display:block; width:14vmin; height:.7vmin; background:#fff; border-radius:1vmin; opacity:.8; margin-top:1.4vmin}
  .desliza .chev{animation:sube 1.6s ease-in-out infinite; font-style:normal; font-size:3vmin; background:none; width:auto; height:auto}
  @keyframes sube{0%,100%{transform:translateY(0); opacity:.5} 50%{transform:translateY(-1vmin); opacity:1}}

  /* ---------- chat ---------- */
  .chat{min-height:100%; padding:2vmin 2vmin 3vmin; display:flex; flex-direction:column; gap:1.3vmin;
    background-color:var(--papel);
    background-image:radial-gradient(rgba(107,30,90,.08) 1.1px, transparent 1.2px), radial-gradient(rgba(11,95,82,.07) 1.1px, transparent 1.2px);
    background-size:3.2vmin 3.2vmin, 3.2vmin 3.2vmin; background-position:0 0, 1.6vmin 1.6vmin}
  .sys{align-self:center; background:var(--crema); color:#5b4a12; font-size:1.9vmin; padding:.7vmin 2vmin; border-radius:1.6vmin; text-align:center; max-width:92%; box-shadow:0 1px 1px rgba(0,0,0,.08); line-height:1.35}
  .sys.ronda{background:#fff; color:var(--tinta); font-weight:700; font-size:2.1vmin; padding:1.2vmin 2.4vmin; border-left:.8vmin solid var(--col,var(--rosa))}
  .sys.ronda small{display:block; font-weight:400; color:var(--gris); font-size:1.8vmin; margin-top:.3vmin}
  .sys.tiempo{background:var(--rojo-suave); color:var(--rojo); font-weight:700}

  .msg{display:flex; flex-direction:column; align-items:flex-start; max-width:90%; animation:entra .25s ease-out}
  @keyframes entra{from{transform:translateY(1.5vmin); opacity:0} to{transform:none; opacity:1}}
  .quien{font-size:1.9vmin; font-weight:700; margin:0 0 .3vmin 1.8vmin; color:var(--col,var(--rosa))}
  .burbuja{position:relative; background:#fff; border-radius:2vmin; border-top-left-radius:.5vmin; padding:1.6vmin 2vmin 2.4vmin; font-size:2.65vmin; line-height:1.4;
    box-shadow:0 1px 1px rgba(0,0,0,.1); color:var(--tinta); width:100%}
  .tipo{display:inline-block; font-size:1.6vmin; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:.35vmin 1.2vmin; border-radius:2vmin; margin-bottom:1vmin; color:#fff}
  .tipo--traducir{background:var(--morado)} .tipo--escribir{background:var(--rosa)} .tipo--error{background:var(--rojo)}
  .inst{font-size:2.1vmin; color:var(--gris); margin-bottom:.9vmin}
  .texto{font-size:3.1vmin; font-weight:600; line-height:1.35}
  .sit{font-size:2.6vmin; line-height:1.4; background:var(--fondo); border-radius:1.4vmin; padding:1.2vmin 1.6vmin; border:1px solid var(--borde)}
  .meta{position:absolute; right:1.6vmin; bottom:.6vmin; font-size:1.6vmin; color:#7d7592; display:flex; gap:.8vmin; align-items:center}
  .meta .palomas{color:#34B7F1}
  .meta .reloj{font-variant-numeric:tabular-nums; font-weight:700; color:var(--jade); background:var(--jade-suave); padding:.1vmin .8vmin; border-radius:1vmin}
  .meta .reloj.alerta{color:var(--rojo); background:var(--rojo-suave)}
  .react{position:absolute; left:1.4vmin; bottom:-1.6vmin; background:#fff; border:1px solid var(--borde); border-radius:2vmin; padding:.2vmin 1vmin; font-size:2.1vmin; font-weight:800; box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .react.ok{color:var(--jade)} .react.medio{color:var(--dorado)} .react.mal{color:var(--rojo)}

  /* chat anidado dentro de una burbuja */
  .mini{display:flex; flex-direction:column; gap:.7vmin; background:var(--papel); border-radius:1.4vmin; padding:1.2vmin; border:1px solid #e2d8cb}
  .mini-m{max-width:88%; padding:.8vmin 1.4vmin; border-radius:1.4vmin; font-size:2.6vmin; line-height:1.35; background:#fff; align-self:flex-start; border-top-left-radius:.4vmin; box-shadow:0 1px 1px rgba(0,0,0,.08)}
  .mini-m.b{align-self:flex-end; background:var(--verde-wa); border-top-left-radius:1.4vmin; border-top-right-radius:.4vmin}
  .mini-m b{display:block; font-size:1.6vmin; color:var(--rosa); margin-bottom:.2vmin; font-weight:700}
  .mini-m.b b{color:var(--jade)}
  .mini-cab{font-size:1.7vmin; color:var(--gris); text-align:center; margin-bottom:.3vmin}

  /* documento dentro de una burbuja */
  .doc{background:#fff; border:1px solid #d9d3c7; border-radius:.6vmin; padding:1.6vmin 2vmin; font-size:2.4vmin; line-height:1.4; box-shadow:.4vmin .4vmin 0 #e6e0d4; position:relative}
  .doc::before{content:""; position:absolute; left:0; top:0; bottom:0; width:.6vmin; background:var(--rosa-luz)}
  .doc-t{font-weight:800; font-size:2.3vmin; text-transform:uppercase; letter-spacing:.06em; color:var(--gris); margin-bottom:.8vmin}
  .doc-f{display:flex; gap:1vmin; border-bottom:1px dotted #bbb; padding:.5vmin 0}
  .doc-f span{color:var(--gris); font-size:2vmin; min-width:12vmin; flex:none; padding-top:.3vmin}
  .doc-f em{font-style:normal; font-family:"Comic Sans MS","Segoe Print","Bradley Hand",cursive; color:#1d3fa8}

  /* clave */
  .msg.clave{align-self:flex-end; align-items:flex-end; max-width:92%}
  .msg.clave .burbuja{background:var(--jade-suave); border:1px solid #BFE7DC; border-radius:2vmin; border-top-right-radius:.5vmin; padding-bottom:1.6vmin}
  .etq{font-size:1.6vmin; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--jade); margin-bottom:.6vmin}
  .clave-txt{font-size:2.5vmin; line-height:1.4; color:var(--tinta)}
  .cuenta{margin-top:1vmin; font-size:2.05vmin; line-height:1.4; color:var(--gris); border-top:1px dashed #9fd4c6; padding-top:.9vmin}
  .cuenta b{color:var(--jade)}
  .formas{margin-top:.8vmin; display:flex; flex-wrap:wrap; gap:.6vmin}
  .formas span{font-size:1.9vmin; font-weight:700; background:#fff; border:1px solid #BFE7DC; color:var(--jade); border-radius:2vmin; padding:.2vmin 1.1vmin}

  /* escribiendo… */
  .puntos{display:inline-flex; gap:.6vmin; padding:.6vmin .4vmin}
  .puntos i{width:1.2vmin; height:1.2vmin; border-radius:50%; background:#9a92ad; animation:bota 1.2s infinite}
  .puntos i:nth-child(2){animation-delay:.2s} .puntos i:nth-child(3){animation-delay:.4s}
  @keyframes bota{0%,60%,100%{transform:translateY(0); opacity:.5} 30%{transform:translateY(-.8vmin); opacity:1}}

  /* encuesta de apuestas */
  .encuesta{min-height:100%; padding:3vmin 2.4vmin 4vmin; display:flex; flex-direction:column; gap:1.4vmin; background:var(--papel)}
  .tarjeta{background:#fff; border-radius:2vmin; padding:2.2vmin 2.4vmin; box-shadow:0 1px 1px rgba(0,0,0,.1)}
  .tarjeta h2{font-size:3vmin; line-height:1.2}
  .tarjeta .sub{font-size:2.05vmin; color:var(--gris); margin-top:.6vmin; line-height:1.4}
  .opc{display:flex; align-items:center; gap:1.6vmin; padding:1.1vmin 0; border-top:1px solid var(--borde)}
  .opc:first-of-type{border-top:none}
  .opc .avatar{width:5vmin; height:5vmin; font-size:2.2vmin; box-shadow:none}
  .opc .nom{flex:1; font-size:2.2vmin; font-weight:700; line-height:1.2}
  .opc .nom small{display:block; font-weight:400; color:var(--gris); font-size:1.75vmin}
  .opc input{width:11vmin; font:inherit; font-size:3vmin; font-weight:800; text-align:center; border:.3vmin solid var(--borde); border-radius:1.4vmin; padding:.6vmin; color:var(--morado); background:var(--fondo)}
  .opc input:focus{outline:none; border-color:var(--rosa)}
  .encuesta .pie-enc{font-size:1.9vmin; color:var(--gris); text-align:center; line-height:1.4}

  /* resultados */
  .fin{min-height:100%; padding:3vmin 2.4vmin 4vmin; display:flex; flex-direction:column; gap:1.6vmin; background:linear-gradient(170deg,#6B1E5A 0%,#2B2440 70%); color:#fff}
  .fin h2{font-size:3.4vmin; line-height:1.15}
  .fin .grande{font-size:12vmin; line-height:1; color:#FFD6E9}
  .fin .grande small{font-size:3.2vmin; color:#fff; opacity:.8; font-weight:600}
  .bat-grande{width:100%; height:5vmin; border:.4vmin solid #fff; border-radius:1.4vmin; padding:.4vmin; position:relative}
  .bat-grande::after{content:""; position:absolute; right:-1.6vmin; top:50%; transform:translateY(-50%); width:1vmin; height:2vmin; background:#fff; border-radius:0 .3vmin .3vmin 0}
  .bat-grande i{display:block; height:100%; border-radius:.8vmin; background:#7ED957; transition:width 1s ease-out}
  .bat-grande i.media{background:#F5C544} .bat-grande i.baja{background:#FF6B6B}
  .fin .nota{font-size:2vmin; opacity:.85; line-height:1.4}
  .tabla{background:rgba(255,255,255,.1); border-radius:2vmin; overflow:hidden}
  .fila{display:grid; grid-template-columns:5vmin 1fr 9vmin 9vmin; gap:1.4vmin; align-items:center; padding:1vmin 2vmin; border-top:1px solid rgba(255,255,255,.12); font-size:2.2vmin}
  .fila:first-child{border-top:none; font-size:1.7vmin; text-transform:uppercase; letter-spacing:.1em; opacity:.75; font-weight:700}
  .fila .avatar{width:4.4vmin; height:4.4vmin; font-size:2vmin; box-shadow:none}
  .fila .num{text-align:center; font-weight:800; font-variant-numeric:tabular-nums}
  .fila.gana{background:rgba(255,214,233,.22)}
  .fila.gana .num:last-child::after{content:" 🏆"}
  .fin .cierre{background:#fff; color:var(--tinta); border-radius:2vmin; padding:2vmin 2.4vmin; font-size:2.4vmin; line-height:1.4}
  .fin .cierre b{color:var(--rosa)}

  /* ---------- panel de mando ---------- */
  #panel{width:34vmin; color:#F4EFF9; display:flex; flex-direction:column; gap:2vmin; flex:none}
  #panel h1{font-size:3.6vmin; line-height:1.1}
  #panel .k{font-size:1.9vmin; letter-spacing:.14em; text-transform:uppercase; color:var(--rosa-luz); font-weight:700}
  #panel p{font-size:2vmin; line-height:1.5; color:#D9CFE8}
  .botones{display:grid; grid-template-columns:1fr 1fr; gap:1.2vmin}
  .botones button{border:none; cursor:pointer; border-radius:2vmin; padding:1.4vmin 1.2vmin; font-weight:800; font-size:2.1vmin; background:rgba(255,255,255,.1); color:#fff; display:flex; flex-direction:column; align-items:center; gap:.3vmin}
  .botones button small{font-weight:400; font-size:1.5vmin; opacity:.7}
  .botones button:hover{background:rgba(255,255,255,.2)}
  .botones .ancho{grid-column:1/-1}
  .botones .ok{background:rgba(126,217,87,.22)} .botones .medio{background:rgba(245,197,68,.22)} .botones .mal{background:rgba(255,107,107,.22)}
  .botones .rev{background:var(--rosa); color:#fff}
  .botones .nav{background:rgba(255,255,255,.14)}
  #paso-txt{font-size:1.9vmin; color:#B9ADD0; font-variant-numeric:tabular-nums}
  #reiniciar{align-self:flex-start; background:none; border:1px solid rgba(255,255,255,.25); color:#B9ADD0; border-radius:2vmin; padding:.6vmin 1.6vmin; font-size:1.7vmin; cursor:pointer}

  @media (max-aspect-ratio: 1/1){
    #escena{flex-direction:column; gap:1.5vmin; padding:1vmin}
    #telefono{width:min(96vw,60vh); height:min(96vw*1.55,86vh)}
    #panel{width:min(96vw,60vh); flex-direction:row; flex-wrap:wrap; align-items:center}
    #panel h1, #panel .k, #panel p{display:none}
    .botones{flex:1}
  }
</style>
</head>
<body>
<div id="escena">
  <div id="telefono">
    <div id="vidrio">
      <div id="barra">
        <span id="hora">10:00</span>
        <span id="centro">🤫</span>
        <span id="der"><span id="marcador">0/18</span><span class="bateria"><i id="carga"></i></span></span>
      </div>
      <div id="cabeza">
        <span class="flecha-atras">‹</span>
        <div class="avatar" id="cab-av">🤫</div>
        <div><div id="cab-nom">Examen secreto 🤫</div><div id="cab-sub">Camila, Equipo 1, Equipo 2, Equipo 3…</div></div>
      </div>
      <div id="pantalla"></div>
    </div>
  </div>

  <aside id="panel">
    <div>
      <div class="k">Semana 11 · La clase al revés</div>
      <h1 class="disp">El examen secreto</h1>
    </div>
    <p>El equipo lee su mensaje, el profe contesta en voz alta, el equipo revela la clave y califica. El reloj corre solo.</p>
    <div class="botones">
      <button class="nav" id="b-atras">◀<small>atrás</small></button>
      <button class="nav" id="b-sigue">▶<small>siguiente · →</small></button>
      <button class="rev ancho" id="b-rev">Revelar la clave<small>tecla R</small></button>
      <button class="ok" id="b-ok">✅<small>bien · 1</small></button>
      <button class="mal" id="b-mal">❌<small>mal · 0</small></button>
      <button class="medio ancho" id="b-medio">½<small>medio punto · 5</small></button>
      <button class="nav ancho" id="b-pausa">⏸ Pausar el reloj<small>tecla P</small></button>
    </div>
    <div id="paso-txt"></div>
    <button id="reiniciar" type="button">↺ Empezar de cero</button>
  </aside>
</div>

<script>
(function(){
  'use strict';

  /* ---------- los equipos, tal como firmaron sus guías ---------- */
  var EQUIPOS = [
    {n:1, nom:'Letras recortadas',  col:'#F6C9DE', tinta:'#6B1E5A', emoji:'✂️', gente:['Yael','Sara','Rafael','Yamila']},
    {n:2, nom:'Números y signos',   col:'#FBD9B2', tinta:'#8a4a05', emoji:'🔢', gente:['Derek','Iris','Francisco','Monserrat']},
    {n:3, nom:'Emojis y stickers',  col:'#FBEFA6', tinta:'#6b5600', emoji:'😅', gente:['Carlo','Arely','Alexander','Estefany']},
    {n:4, nom:'Palabras prestadas', col:'#CDE8D4', tinta:'#0B5F52', emoji:'🌎', gente:['Marissa','Alan','Kevin','Ainara']},
    {n:5, nom:'Reglas de tono',     col:'#CFE2F3', tinta:'#1d3f6e', emoji:'🎚️', gente:['Aurora','Yocsan','Yuritza','Iker']},
    {n:6, nom:'Frases del momento', col:'#E8CFE6', tinta:'#6B1E5A', emoji:'🔥', gente:['Camila','Jonathan','Ángel','Yoali','André']}
  ];

  /* ---------- las dieciocho preguntas: tres por equipo, una de cada tipo ----------
     Todo lo que aparece está en alguna de las seis guías. Nada más. */
  var P = [
    /* ===== Equipo 1 · Letras recortadas (tmb, xq, ntp, bn) ===== */
    {eq:1, tipo:'traducir', de:'Yael', seg:25,
     msg:'<div class="inst">Pásalo a español completo:</div><div class="texto">xq no llegaste ayer? tmb te esperamos, ntp, bn, mañana nos vemos</div>',
     clave:'«¿Por qué no llegaste ayer? También te esperamos. No te preocupes. Bien, mañana nos vemos.»',
     cuenta:'<b>Punto:</b> las cuatro formas traducidas. <b>Medio:</b> tres de cuatro. Si lee «xq» como «porque», está mal: aquí pregunta.',
     formas:['xq','tmb','ntp','bn']},
    {eq:1, tipo:'escribir', de:'Sara', seg:40,

  var LLAVE = 'examen-secreto-s11';

  function guardar(){ try{ localStorage.setItem(LLAVE, JSON.stringify(S)); }catch(e){} }
  function cargar(){ try{ return JSON.parse(localStorage.getItem(LLAVE)); }catch(e){ return null; } }

  /* ---------- marcador y batería ---------- */
  function aciertos(){
    var s = 0; for(var i = 0; i < P.length; i++){ if(S.cal[i] === 1) s += 1; else if(S.cal[i] === 0.5) s += .5; }
    return s;
  }
  function bonito(x){ var e = Math.floor(x); return (x % 1 ? (e ? e + '½' : '½') : e); }
  function pintaMarcador(){
    var a = aciertos(), pct = a / P.length * 100;
    marcador.textContent = bonito(a) + '/' + P.length;
    carga.style.width = Math.max(pct, a > 0 ? 6 : 0) + '%';
    carga.className = pct >= 50 ? '' : pct >= 25 ? 'media' : 'baja';
  }

  /* ---------- reloj de los diez minutos ---------- */
  function pintaHora(){
    var m = Math.floor(S.resta / 60), s = S.resta % 60;
    hora.textContent = pad(m) + ':' + pad(s);
    barra.classList.toggle('alerta', S.resta <= 60);
    barra.classList.toggle('pausa', !corriendo && S.resta < 600 && S.resta > 0);
    hora.classList.toggle('parpadea', S.resta === 0);
    bPausa.innerHTML = (corriendo ? '⏸ Pausar el reloj' : S.resta === 600 ? '⏱ El reloj arranca solo' : S.resta === 0 ? '⏰ Se acabó el tiempo' : '▶ Reanudar el reloj') + '<small>tecla P</small>';
  }
  function arranca(){
    if(corriendo || S.resta <= 0) return;
    corriendo = true;
    reloj = setInterval(function(){
      S.resta--;
      if(S.resta <= 0){ S.resta = 0; clearInterval(reloj); reloj = null; corriendo = false; S.fuera = true; guardar(); render(0); }
      pintaHora(); if(S.resta % 5 === 0) guardar();
    }, 1000);
    pintaHora();
  }
  function pausa(){ if(reloj){ clearInterval(reloj); reloj = null; } corriendo = false; pintaHora(); guardar(); }
  function alterna(){ if(corriendo) pausa(); else arranca(); }

      if(q.t === 'reglas') html += msgReglas();
      else if(q.t === 'ronda') html += msgRonda(q.eq);
      else if(q.t === 'cierre') html += msgCierre();
      else if(q.t === 'preg'){
        if(esUltimo && dir > 0 && !S.visto[q.i]){ ultimoI = q.i; }
        else { html += msgPregunta(q.i, esUltimo && !S.rev[q.i] && S.cal[q.i] == null); if(S.rev[q.i]) html += msgClave(q.i); }
      }
    }
    if(S.fuera) html += sys('⏰ Se acabaron los diez minutos. Lo que falte se contesta sin reloj.', 'tiempo');
    pantalla.innerHTML = '<div class="chat">' + html + '</div>';
    var chat = pantalla.firstChild;
    if(relojQ){ clearInterval(relojQ); relojQ = null; }
    if(ultimoI !== null){
      var e = eq(P[ultimoI].eq), sub = document.getElementById('cab-sub');
      sub.textContent = P[ultimoI].de + ' está escribiendo…'; sub.classList.add('escribiendo');
      chat.insertAdjacentHTML('beforeend', '<div class="msg escribiendo" style="--col:' + e.tinta + '"><div class="quien">' + P[ultimoI].de + ' · Equipo ' + e.n + '</div><div class="burbuja" style="width:auto;padding:1vmin 1.6vmin"><span class="puntos"><i></i><i></i><i></i></span></div></div>');
      abajo();
      var miPaso = S.paso;
      setTimeout(function(){
        if(S.paso !== miPaso) return;
        S.visto[ultimoI] = true; guardar();
        var t = chat.querySelector('.escribiendo'); if(t) t.remove();
        chat.insertAdjacentHTML('beforeend', msgPregunta(ultimoI, true));
        sub.textContent = e.gente.join(', '); sub.classList.remove('escribiendo');
        abajo(); cuentaRegresiva(ultimoI);
      }, 1100);
    } else {
      var vivo = chat.querySelector('[data-reloj]');
      if(vivo) cuentaRegresiva(PASOS[S.paso].i);
      abajo();
    }
  }
  function cuentaRegresiva(i){
    var el = pantalla.querySelector('[data-reloj]'); if(!el) return;
    var fin = Date.now() + P[i].seg * 1000;
    relojQ = setInterval(function(){
      var r = Math.max(0, Math.ceil((fin - Date.now()) / 1000));
      el.textContent = r + ' s'; el.classList.toggle('alerta', r <= 5);
      if(r === 0){ clearInterval(relojQ); relojQ = null; }
    }, 250);
  }
  function abajo(){ requestAnimationFrame(function(){ pantalla.scrollTop = pantalla.scrollHeight + 999; }); }

  function vistaFin(){
    cabeza.classList.remove('ver'); pausa();
    var a = aciertos(), pct = a / P.length * 100, sin = 0;
    for(var i = 0; i < P.length; i++) if(S.cal[i] == null) sin++;
    var mejor = null;
    EQUIPOS.forEach(function(e, k){ if(S.apuestas[k] !== ''){ var d = Math.abs(S.apuestas[k] - a); if(mejor === null || d < mejor) mejor = d; } });
    var filas = EQUIPOS.map(function(e, k){
      var ap = S.apuestas[k], d = ap === '' ? null : Math.abs(ap - a), gana = d !== null && d === mejor;
      return '<div class="fila' + (gana ? ' gana' : '') + '">' + avatarHTML(e) + '<div>Equipo ' + e.n + '<br><small style="opacity:.75">' + e.nom + '</small></div>' +
        '<div class="num">' + (ap === '' ? '—' : ap) + '</div><div class="num">' + (d === null ? '—' : bonito(d)) + '</div></div>';
    }).join('');
    var frase = pct >= 83 ? 'La guía quedó buena. Muy buena.' : pct >= 61 ? 'Aprobó. Lo que falló, faltó en la guía.' : pct >= 40 ? 'A medias: la mitad de la guía no llegó.' : 'Reprobó. Algo grande faltó en la guía.';
    pantalla.innerHTML = '<div class="fin">' +
      '<h2 class="disp">Resultado del profe</h2>' +
      '<div class="grande disp">' + bonito(a) + ' <small>de ' + P.length + '</small></div>' +
      '<div class="bat-grande"><i class="' + (pct >= 50 ? '' : pct >= 25 ? 'media' : 'baja') + '" style="width:' + Math.max(pct, a > 0 ? 3 : 0) + '%"></i></div>' +
      '<div class="nota">' + frase + (sin ? ' (' + sin + ' sin calificar.)' : '') + '</div>' +
      '<div class="tabla"><div class="fila"><div></div><div>Equipo</div><div class="num">Apuesta</div><div class="num">Distancia</div></div>' + filas + '</div>' +
      '<div class="cierre"><b>Para cerrar:</b> ¿qué fue lo que le costó más aprender, y qué tenía que haber traído la guía para que no le costara?</div></div>';
  }

  /* ---------- render maestro ---------- */
  function render(dir){
    var paso = PASOS[S.paso];
    if(paso.t === 'lock') vistaLock();
    else if(paso.t === 'apuestas') vistaApuestas();
    else if(paso.t === 'fin') vistaFin();
    else vistaChat(dir);
    if(paso.t === 'preg' && dir > 0) arranca();
    pintaMarcador(); pintaHora();
    var nP = paso.t === 'preg' ? 'Pregunta ' + (paso.i + 1) + ' de 18 · Equipo ' + P[paso.i].eq : paso.t === 'ronda' ? 'Ronda ' + paso.eq + ' de 6' : paso.t === 'lock' ? 'Pantalla bloqueada' : paso.t === 'apuestas' ? 'Las apuestas' : paso.t === 'reglas' ? 'Las reglas' : paso.t === 'cierre' ? 'La pregunta del curso' : 'Resultados';
    pasoTxt.textContent = nP + ' · paso ' + (S.paso + 1) + '/' + PASOS.length;
    guardar();
  }
  function ir(d){
    var n = S.paso + d; if(n < 0 || n >= PASOS.length) return;
    if(PASOS[S.paso].t === 'apuestas' && d > 0 && document.activeElement) document.activeElement.blur();
    S.paso = n; render(d);
  }
  function pregActual(){ var p = PASOS[S.paso]; return p.t === 'preg' ? p.i : null; }
  function revela(){ var i = pregActual(); if(i === null) return; if(!S.visto[i]) S.visto[i] = true; S.rev[i] = true; guardar(); render(0); }
  function califica(v){ var i = pregActual(); if(i === null) return; S.visto[i] = true; S.rev[i] = true; S.cal[i] = (S.cal[i] === v ? null : v); guardar(); render(0); }

  /* ---------- mandos ---------- */
  document.getElementById('b-sigue').addEventListener('click', function(){ ir(1); });
  document.getElementById('b-atras').addEventListener('click', function(){ ir(-1); });
  document.getElementById('b-rev').addEventListener('click', revela);
  document.getElementById('b-ok').addEventListener('click', function(){ califica(1); });
  document.getElementById('b-medio').addEventListener('click', function(){ califica(0.5); });
  document.getElementById('b-mal').addEventListener('click', function(){ califica(0); });
  bPausa.addEventListener('click', alterna);
  document.getElementById('reiniciar').addEventListener('click', function(){
    if(!confirm('¿Borrar calificaciones, apuestas y reloj, y volver a la pantalla bloqueada?')) return;
    pausa(); try{ localStorage.removeItem(LLAVE); }catch(e){}
    S = {paso:0, cal:[], rev:[], visto:[], apuestas:['','','','','',''], resta:600, fuera:false}; render(0);
  });
  pantalla.addEventListener('click', function(e){ if(PASOS[S.paso].t === 'lock') ir(1); });
  document.addEventListener('click', function(e){ var b = e.target && e.target.closest ? e.target.closest('button') : null; if(b) b.blur(); });
  document.addEventListener('keydown', function(e){
    if(e.repeat) return;
    var tag = e.target && e.target.tagName;
    if(tag === 'INPUT'){ return; }
    if(tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
    var k = e.key;
    if(k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter'){ e.preventDefault(); ir(1); }
    else if(k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); ir(-1); }
    else if(k === 'r' || k === 'R'){ revela(); }
    else if(k === '1'){ califica(1); }
    else if(k === '5'){ califica(0.5); }
    else if(k === '0'){ califica(0); }
    else if(k === 'p' || k === 'P'){ alterna(); }
  });

  render(0);
})();
</script>
</body>
</html>
